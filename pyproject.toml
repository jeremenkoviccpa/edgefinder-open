[project]
name = "edgefinder"
version = "0.1.0"
description = "Open-data re-implementation of A1 Trading's EdgeFinder scoring, with an open-source LLM digest layer"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.2",
    "numpy>=1.26",
    "requests>=2.32",
    "yfinance>=0.2.50",
    "xlrd>=2.0",
    "openai>=1.50",
    "rich>=13",
    "python-dotenv>=1.0",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "apscheduler>=3.10",
]

[project.scripts]
ef = "edgefinder.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["edgefinder"]
